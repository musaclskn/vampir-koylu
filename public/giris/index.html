<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Vampir Köylü · Moderatör girişi</title>
<link rel="stylesheet" href="/ortak/tema.css">
<link rel="stylesheet" href="/giris/style.css">
</head>
<body>
  <main class="wrap">
    <form id="form" class="card" autocomplete="on">
      <div class="mark" aria-hidden="true">🧛</div>
      <h1 class="title">VAMPİR KÖYLÜ</h1>
      <p class="sub">Moderatör girişi</p>
      <label class="label" for="password">Şifre</label>
      <input id="password" name="password" type="password" class="input" autocomplete="current-password" required autofocus>
      <p id="error" class="error" role="alert" hidden></p>
      <button id="submit" class="btn" type="submit">Giriş yap</button>
      <p class="hint">Oyuncu musun? <a href="/">Oyuna katılmak için buraya dokun.</a></p>
    </form>
  </main>
  <script src="/giris/app.js"></script>
</body>
</html>
