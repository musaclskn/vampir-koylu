<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0710">
<meta name="color-scheme" content="dark">
<title>Vampir Köylü</title>
<link rel="stylesheet" href="/oyuncu/style.css">
</head>
<body data-phase="lobby" data-sky="dusk">
  <div class="sky sky-dusk" aria-hidden="true"></div>
  <div class="sky sky-night" aria-hidden="true"></div>
  <div class="sky sky-day" aria-hidden="true"></div>
  <div class="fog" aria-hidden="true"><span></span><span></span></div>
  <div class="vignette" aria-hidden="true"></div>

  <div id="conn" class="conn" role="status" aria-live="polite" hidden>Yeniden bağlanıyor…</div>

  <header id="top" class="top" hidden>
    <div class="who">
      <span id="topAvatar" class="avatar sm" aria-hidden="true"></span>
      <span id="topName" class="who-name"></span>
    </div>
    <div class="phase">
      <span id="topPhase" class="phase-name"></span>
      <span id="topTimer" class="timer" aria-live="off"></span>
    </div>
    <div class="top-btns">
      <button id="btnRole" class="icon-btn" type="button" aria-label="Rolüm" hidden><span aria-hidden="true">🎴</span><small>Rolüm</small></button>
      <button id="btnLog" class="icon-btn" type="button" aria-label="Günlüğüm" hidden><span aria-hidden="true">📜</span><small>Günlüğüm</small><b id="logBadge" class="badge" hidden></b></button>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close="1"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="icon-btn close" type="button" data-close="1" aria-label="Kapat">✕</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script src="/oyuncu/app.js"></script>
</body>
</html>
